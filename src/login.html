<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · Comercial IA PRO</title><link rel="stylesheet" href="../styles.css"></head><body><main class="content" style="max-width:480px;margin:auto"><div class="hero"><h2>Comercial IA PRO</h2><div>Acceso privado</div></div><div class="card"><div class="field"><label>Email</label><input id="email" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"></div><div class="row"><button class="btn" id="login">Entrar</button><button class="btn secondary" id="recover">Recuperar contraseña</button></div><p id="msg" class="muted"></p></div><script type="module">import {supabase,signIn} from './auth.js'; const msg=t=>document.querySelector('#msg').textContent=t; document.querySelector('#login').onclick=async()=>{try{let r=await signIn(email.value,password.value);if(r.error)throw r.error;location.href='../'}catch(e){msg(e.message)}};document.querySelector('#recover').onclick=async()=>{if(!supabase)return msg('Supabase no configurado');let r=await supabase.auth.resetPasswordForEmail(email.value,{redirectTo:location.origin});msg(r.error?r.error.message:'Revisa tu correo para recuperar la contraseña.')};</script></main></body></html>
